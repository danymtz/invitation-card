<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta property="og:description" content="Aranza Mayte">
    <meta property="og:description" content="Invitación | Mi 1er Año">
    <meta property="og:type" content="website">
    <title>Aranza | Mi 1er año</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/petals.css">
    <link rel="stylesheet" href="styles/typing.css">
    <link rel="stylesheet" href="styles/audio-button.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body style="position: relative; background: linear-gradient(242deg, #ffffff 23%, #c08787 100%);">

    <!-- ------------- Efecto petalos de rosas --------------->
    <div class="falling-leaves"></div>
    <script src="js/petals.js"></script>

    <section class="invitation-container">

        <div class="roses-top">
            <img src="assets/roses-cutted.png" alt="">
        </div>

        <!------------------ Foto festejada ---------------------->
        <div class="photo">
            <img src="assets/child.png" alt="">
        </div>

        <!--------------------- Música de fondo ------------------>
        <audio id="myAudio" loop>
            <source src="assets/perfecta.mp3" type="audio/mpeg">
        </audio>
        <button id="muteButton" class="mute-btn"><span class="material-icons">volume_off</span></button>
        <script src="js/audio.js"> </script>

        <div
            style="display: flex; flex-direction: column; align-items: center; margin: 14px; text-align: center; gap: 17px;">
            <p style="font-style: italic; font-size: 18px; height: 56px;" id="typedText">
                <span id="text"></span><span class="cursor">|</span>
            </p>
            <!------------- Typing de frases ------------>
            <script src="js/phrases-typing.js"></script>
            <p>¡Te esperamos!</p>
        </div>

        <div class="event-date">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="assets/double-arrow.png" alt="" style="width: 90px;">
                <p>Sábado</p>
                <img src="assets/double-arrow.png" alt="" style="width: 90px;">
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <p style="font-size: 30px;">7</p>
                <p>Febrero</p>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <img src="assets/double-arrow.png" alt="" style="width: 90px;">
                <p>15:00 horas</p>
                <img src="assets/double-arrow.png" alt="" style="width: 90px;">
            </div>
        </div>

        <!----------------- Cuenta regresiva ---------------------->
        <div id="countdown" style="margin: 18px 0; "></div>
        <script src="js/countdown.js"></script>

        <!----------------- Dirección del evento ------------------->
        <section style="display: flex; flex-direction: column; align-items: center;">
            <div style="font-size: 18px;">
                Finca San Juan
            </div>

            <div style="font-size: 13px;">
                Av. Chimalpopoca 46,
            </div>

            <div style="font-size: 13px;">
                San Cristobal Nexquipayac,
            </div>

            <div>56315, Mex</div>

            <!------------ Botón hacia Google Maps ------------>
            <div class="location">
                <a href="https://www.google.com/maps?q=19.5787041,-98.928756"
                    style="display: flex; flex-direction: row; align-items: center;"><span
                        class="material-icons">location_on</span> Ver ubicación</a>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; margin: 14px;">
                <p>¡No faltes!</p>
            </div>
        </section>

        <div class="roses-bottom">
            <img src="assets/roses-cutted.png" alt="">
        </div>
    </section>
</body>

</html>
